name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create/update GitHub Release and upload artifacts"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# OSSF Token-Permissions: read-all top-level; the build job opts into the
# narrower contents: write + id-token: write that it actually needs.
permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 9 and 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # [issue #109] The plugin multi-targets net9.0 (Jellyfin 10.11)
          # and net10.0 (Jellyfin 12). Building needs only the .NET 10 SDK,
          # but running the net9.0 test suite needs the .NET 9 runtime too.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build and package
        id: pkg
        # [issue #143] The same script CI runs on every pull request, so a
        # release ships the build and packaging CI has already been through.
        # It also stops here if a DLL is stamped with any other version than
        # its zip, which Jellyfin needs to be equal (#140).
        run: bash .github/scripts/build-packages.sh

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign binary to v2.4.0 — newer v3+ cosign defaults to
          # --new-bundle-format which silently ignores --output-signature
          # and --output-certificate flags, breaking the .sig/.pem assets
          # Scorecard's Signed-Releases check looks for. v2.4.0 keeps the
          # legacy flag behavior.
          cosign-release: 'v2.4.0'

      - name: Sign release zip
        if: ${{ github.event.inputs.publish_release == 'true' }}
        run: |
          set -euo pipefail
          for ZIP in "${{ steps.pkg.outputs.zippath }}" "${{ steps.pkg.outputs.zippath12 }}"; do
            cosign sign-blob --yes \
              --output-signature "${ZIP}.sig" \
              --output-certificate "${ZIP}.pem" \
              "$ZIP"
          done

      # SLSA build provenance: GitHub's first-party attestation action signs
      # an in-toto attestation linking the zip to this workflow run + commit
      # SHA. Lifts OpenSSF Scorecard's Signed-Releases check from partial to
      # full credit. Verify downstream with
      # `gh attestation verify --owner ZL154 <zip>`.
      - name: Attest build provenance
        id: attest
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.pkg.outputs.zippath }}
            ${{ steps.pkg.outputs.zippath12 }}

      - name: Stage attestation as release asset
        if: ${{ github.event.inputs.publish_release == 'true' }}
        run: |
          set -euo pipefail
          # One bundle attests both zips; publish it under each name so a
          # download of either zip finds its provenance beside it.
          cp '${{ steps.attest.outputs.bundle-path }}' "${{ steps.pkg.outputs.zippath }}.intoto.jsonl"
          cp '${{ steps.attest.outputs.bundle-path }}' "${{ steps.pkg.outputs.zippath12 }}.intoto.jsonl"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: achievementbadges-plugin
          path: |
            dist/Jellyfin.Plugin.AchievementBadges_*.zip
            dist/Jellyfin.Plugin.AchievementBadges_*.md5
            dist/Jellyfin.Plugin.AchievementBadges_*.sha256
            dist/Jellyfin.Plugin.AchievementBadges_*.sig
            dist/Jellyfin.Plugin.AchievementBadges_*.pem
            dist/Jellyfin.Plugin.AchievementBadges_*.intoto.jsonl

      - name: Create or update release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.pkg.outputs.tag }}"
          ASSETS=()
          for ZIP in "${{ steps.pkg.outputs.zippath }}" "${{ steps.pkg.outputs.zippath12 }}"; do
            ASSETS+=("$ZIP" "${ZIP}.md5" "${ZIP}.sha256" "${ZIP}.sig" "${ZIP}.pem" "${ZIP}.intoto.jsonl")
          done
          # Release body: prefer docs/release-notes/v<VERSION>.md when present,
          # else fall back to a generic blurb. Lets each release ship a real
          # changelog without editing the workflow file.
          NOTES_FILE=""
          if [ -f "docs/release-notes/v${{ steps.pkg.outputs.version }}.md" ]; then
            NOTES_FILE="docs/release-notes/v${{ steps.pkg.outputs.version }}.md"
          elif [ -f "docs/release-notes/${TAG}.md" ]; then
            NOTES_FILE="docs/release-notes/${TAG}.md"
          fi
          if [ -z "$NOTES_FILE" ]; then
            echo "Automated release for Achievement Badges for Jellyfin ${{ steps.pkg.outputs.version }}. Sigstore-signed zip: verify with cosign verify-blob." > "$RUNNER_TEMP/notes.md"
            NOTES_FILE="$RUNNER_TEMP/notes.md"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES_FILE" \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$NOTES_FILE"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${ASSETS[@]}" --clobber

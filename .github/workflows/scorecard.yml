name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # repo_token grants the scorecard-action enough scope to read
          # classic branch-protection rules. The default GITHUB_TOKEN
          # can't, which makes the Branch-Protection check error out with
          # "internal error: some github tokens can't read classic branch
          # protection rules". The secret is a fine-grained PAT scoped to
          # this single repo with Administration: Read-only.
          # If the secret is unset, scorecard-action falls back to
          # GITHUB_TOKEN and the Branch-Protection check stays in error
          # state — non-fatal for the rest of the run.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          # publish_results=true publishes the score to the public
          # api.securityscorecards.dev API.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to GitHub code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
